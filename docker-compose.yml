# ── RIG OS Agency — docker-compose ─────────────────────────────────
# Full local stack: app + postgres + redis + optional workers

services:
  rig-os-agency:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3737:3737"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3737
      # Wire to local services
      - DATABASE_URL=postgresql://rigos:rigos@postgres:5432/rigos
      - REDIS_URL=redis://redis:6379
      # Agent keys (mounted via .env)
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3737/api/health').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rigos
      POSTGRES_PASSWORD: rigos
      POSTGRES_DB: rigos
    volumes:
      - rigos_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  rigos_pgdata: